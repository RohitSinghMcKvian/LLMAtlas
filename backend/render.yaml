services:
  - type: web
    name: llmatlas-api
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: CLOUDFLARE_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: SYNC_CRON_EXPRESSION
        value: "0 2 * * *"
      - key: RSS_FEED_URLS
        value: "https://arxiv.org/rss/cs.AI,https://arxiv.org/rss/cs.CL,https://openai.com/blog/rss.xml,https://www.anthropic.com/rss/news.xml,https://blog.google/technology/ai/rss/,https://ai.meta.com/blog/rss/"
